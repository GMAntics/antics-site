<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-itunes-app" content="app-id=6787743558">
  <title>Get Antics</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Download Antics, the pass-the-phone party games app.">
  <!-- No meta-refresh fallback: it cannot be cancelled per-platform, and it
       was bouncing Android scanners to Apple. No-JS users get the button. -->
  <style>
    :root { --bg: #0E0A1F; --pink: #FF2E7E; --cta-pink: #EA0059; --white: #FFFFFF; --dim: #9C92C7; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--white); min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 32px 20px;
    }
    .logo { font-size: 40px; font-weight: 900; letter-spacing: 6px; }
    .tag { color: var(--dim); margin-top: 8px; font-size: 16px; }
    .status { margin-top: 28px; font-size: 15px; color: var(--dim); }
    .btn {
      display: inline-block; margin-top: 18px; background: var(--cta-pink);
      color: var(--white); text-decoration: none; font-weight: 800;
      padding: 14px 28px; border-radius: 999px; font-size: 16px;
    }
    .small { margin-top: 22px; font-size: 13px; color: var(--dim); }
    .small a { color: var(--dim); }
  </style>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0E0A1F">
</head>
<body>
  <div class="logo">ANTICS</div>
  <p class="tag">Pass the phone. Start scandals.</p>

  <p class="status" id="status">Opening the App Store&hellip;</p>
  <a class="btn" id="store" href="https://apps.apple.com/app/id6787743558">Get Antics on iPhone</a>

  <p class="small">Not working? <a href="/">anticsapp.com</a></p>

  <script>
    // The QR on the in-app referral card points here rather than straight at
    // the App Store: this page always resolves (even before the app is live),
    // it can be repointed without shipping an app update, and every scan is
    // counted by the privacy-first analytics beacon below. The short delay
    // guarantees the beacon fires before the redirect.
    (function () {
      // Flip to true the day the Play production listing is public.
      var PLAY_LIVE = true;
      // Apple App Analytics provider token for campaign (ct=) attribution
      // (read from ASC Campaign Link Generator, 27 Aug 2026). With it set,
      // ASC Analytics > Acquisition > Campaigns reports downloads per ct=
      // code (campaigns appear once 5+ Apple accounts install via a link).
      var PT = '129126454';
      var APPLE = 'https://apps.apple.com/app/id6787743558';
      var PLAY = 'https://play.google.com/store/apps/details?id=com.anticsapp.antics';

      // ?c=<code> tags this visit to a campaign (street-team QR, creator
      // link). Sanitised hard: it ends up in store URLs and analytics.
      var code = null;
      var offer = null;
      try {
        var q = location.search.toLowerCase();
        var m = /[?&]c=([a-z0-9-]{1,32})(&|$)/.exec(q);
        if (m) code = m[1];
        var mo = /[?&]o=([a-z0-9]{1,20})(&|$)/.exec(q);
        if (mo) offer = mo[1].toUpperCase();
      } catch (e) {}
      if (code) {
        APPLE += '?ct=' + code + (PT ? '&pt=' + PT + '&mt=8' : '');
        PLAY += '&referrer=' + encodeURIComponent('utm_source=antics_get&utm_medium=qr&utm_campaign=' + code);
      }

      // Meta Pixel, for Instagram/Facebook ad visits ONLY (Guy ruled it
      // 18 Sep 2026). Meta needs the pixel to fire before we navigate away
      // or the visit never counts as a landing page view. Two hard rules:
      // (1) it loads only when ?c= starts with "meta-", so promoter QRs,
      // Reddit and bio links request nothing from Meta at all; (2) it can
      // never hold up or break the redirect. The 600ms cap below always
      // expires before the existing 900ms redirect delay, so a slow,
      // blocked or throwing Meta script costs the visitor nothing: the
      // redirect still happens at 900ms exactly as it did before.
      var META_PIXEL_ID = '2514730195715118';
      var pixelDone = true;   // true = nothing to wait for
      var pixelWaiting = null;
      function pixelSettled() {
        if (pixelDone) return;
        pixelDone = true;
        var fn = pixelWaiting;
        pixelWaiting = null;
        if (fn) { try { fn(); } catch (e) {} }
      }
      function afterPixel(fn) {
        if (pixelDone) { fn(); return; }
        pixelWaiting = fn;
      }
      if (code && code.indexOf('meta-') === 0) {
        pixelDone = false;
        setTimeout(pixelSettled, 600); // hard cap, whatever Meta does
        try {
          (function (f, b, e, v, n, t, s) {
            if (f.fbq) return;
            n = f.fbq = function () {
              n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
            };
            if (!f._fbq) f._fbq = n;
            n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = [];
            t = b.createElement(e); t.async = !0; t.src = v;
            t.onload = function () { setTimeout(pixelSettled, 50); };
            t.onerror = function () { pixelSettled(); };
            s = b.getElementsByTagName(e)[0];
            if (s && s.parentNode) { s.parentNode.insertBefore(t, s); }
            else { b.head.appendChild(t); }
          })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
          window.fbq('init', META_PIXEL_ID);
          window.fbq('track', 'PageView');
        } catch (e) { pixelSettled(); } // a throw must never strand anyone
      }

      var ua = navigator.userAgent;
      var android = /android/i.test(ua);
      var ios = /iphone|ipad|ipod/i.test(ua);

      // Street-team flyers: ?o=<offercode> routes iPhones through Apple's
      // offer-redemption flow, which applies the free week AND installs the
      // app in one sheet - nobody types a code. Android ignores it (offer
      // codes are Apple-only; Play route unchanged). Trade-off: the redeem
      // URL cannot carry ct=, so iOS download attribution for these scans
      // comes from redemptions-per-code instead.
      // The 21 street-team codes minted for freshers expire 31 Oct 2026 and
      // Apple cannot extend a code in place, so each has a replacement with
      // an X suffix (expires 30 Jun 2027, ops/asc-street-offer-extend.mjs).
      // The printed QRs carry the old spelling forever; from 1 Nov 2026 this
      // page hands Apple the replacement instead. Date-gated so a scan before
      // then still redeems the original, which is what the ledger expects.
      // CHLOE1/CHLOE2 and IZZY/IZZY1 are NOT here: their X replacements were
      // reassigned permanently to Emma and Ryan on 23 Sep 2026, so those two
      // links must never be rewritten onto someone else's codes.
      var EXTENDED = ['AMANZ','BELLE1','BELLE2','BOURN1','BOURN2','ERIN1','ERIN2','GEORGIA1','GEORGIA2','LEEDS1','LEEDS2','NEWC1','NEWC2','NOTTS1','NOTTS2','PIPPA1','PIPPA2'];
      if (offer && EXTENDED.indexOf(offer) !== -1 && new Date() >= new Date('2026-11-01T00:00:00Z')) {
        offer = offer + 'X';
      }
      if (offer && ios) {
        APPLE = 'https://apps.apple.com/redeem?ctx=offercodes&id=6787743558&code=' + offer;
      }

      // Scan/visit beacon into our own sink (same privacy contract as the
      // app: no identifiers, random per-visit session id). Fire-and-forget;
      // the 900ms redirect delay below guarantees it gets out.
      try {
        fetch('https://amioohsgipjzagmclwle.supabase.co/functions/v1/ingest-events', {
          method: 'POST',
          keepalive: true,
          headers: {
            'Content-Type': 'application/json',
            'x-antics-key': '3ee624f1eea2a9e2b1f6aa66955369e4a4942134f46ac504',
          },
          body: JSON.stringify({
            events: [{
              name: 'get_visit',
              props: { code: code || 'none', offer: offer || 'none', dest: android ? 'android' : ios ? (offer ? 'ios-redeem' : 'ios') : 'desktop' },
              ts: new Date().toISOString(),
              sessionId: 'web-' + Math.random().toString(36).slice(2, 10),
              appVersion: 'site',
              platform: 'web',
            }],
          }),
        }).catch(function () {}); // beacon must never surface an error
      } catch (e) {}

      var status = document.getElementById('status');
      var btn = document.getElementById('store');
      btn.href = APPLE; // carry the campaign tag on the visible button too
      if (android && !PLAY_LIVE) {
        // No redirect: the Play listing is not public yet, and sending an
        // Android phone to Apple's store installs nothing.
        status.textContent = 'Antics for Android is days away.';
        btn.textContent = 'See what’s coming';
        btn.href = '/';
        return;
      }
      if (android) {
        status.textContent = 'Opening Google Play…';
        btn.textContent = 'Get Antics on Android';
        btn.href = PLAY;
        setTimeout(function () { afterPixel(function () { window.location.replace(PLAY); }); }, 900);
        return;
      }
      if (ios) {
        setTimeout(function () { afterPixel(function () { window.location.replace(APPLE); }); }, 900);
        return;
      }
      // Desktop or unknown device: no redirect (auto-bouncing a desktop
      // browser to Apple stranded Android owners reading on laptops).
      // Offer both stores and let them choose.
      status.textContent = 'Free on iPhone and Android.';
      btn.textContent = 'App Store';
      var play = btn.cloneNode(false);
      play.id = 'store-play';
      play.href = PLAY;
      play.textContent = 'Google Play';
      play.style.marginLeft = '10px';
      btn.parentNode.insertBefore(play, btn.nextSibling);
    })();
  </script>

</body>
</html>
